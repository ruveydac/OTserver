name: Release Scanner

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --locked --release
        working-directory: scanner
      - run: tar czf otserver-scanner-linux-x86_64.tar.gz -C scanner/target/release otserver-scanner
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-scanner-linux-x86_64
          path: otserver-scanner-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --locked --release
        working-directory: scanner
      - uses: actions/upload-artifact@v7
        with:
          name: otserver-scanner-windows-x86_64
          path: scanner/target/release/otserver-scanner.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: |
          mv artifacts/otserver-scanner-linux-x86_64/otserver-scanner-linux-x86_64.tar.gz .
          mv artifacts/otserver-scanner-windows-x86_64/otserver-scanner.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            otserver-scanner-linux-x86_64.tar.gz
            otserver-scanner.exe
          generate_release_notes: true
