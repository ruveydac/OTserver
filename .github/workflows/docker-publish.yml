name: Docker

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Controller and production image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev openssl
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
        if: github.event_name == 'push'
      - run: pnpm lint
        if: github.event_name == 'push'
      - run: pnpm test:coverage
        if: github.event_name == 'push'
      - run: pnpm build
        if: github.event_name == 'push'
      - name: Run exact management/Otter controller gate
        run: ./otserver-otter/lab/test-controller.sh
      - name: Build and smoke-test the production image
        if: ${{ !cancelled() }}
        run: pnpm test:container
      - name: Upload controller reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: otserver-otter/lab/artifacts/controller.*/
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build and publish image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest
      - id: publish-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record release inputs and artifact digest
        env:
          IMAGE_DIGEST: ${{ steps.publish-image.outputs.digest }}
        run: |
          {
            echo "Management commit: $(git rev-parse HEAD)"
            echo "Otter commit: $(git -C otserver-otter rev-parse HEAD)"
            echo "Image digest: $IMAGE_DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
