name: Docker Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev openssl
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:generated
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Run exact management/Otter controller gate
        run: ./otserver-otter/lab/test-controller.sh
      - run: pnpm test:container
      - name: Upload controller reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-controller-${{ github.sha }}
          path: otserver-otter/lab/artifacts/controller.*/
          if-no-files-found: ignore
  publish:
    needs: verify
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest
      - id: publish-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record release inputs and artifact digest
        env:
          IMAGE_DIGEST: ${{ steps.publish-image.outputs.digest }}
        run: |
          {
            echo "Management commit: $(git rev-parse HEAD)"
            echo "Otter commit: $(git -C otserver-otter rev-parse HEAD)"
            echo "Image digest: $IMAGE_DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
