name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/otserver-ci?replicaSet=rs0&directConnection=true
      OTSERVER_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --detach --wait mongo
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm test:coverage:app
      - run: pnpm build
      - run: git diff --check
