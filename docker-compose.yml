services:
  otserver:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/otserver?replicaSet=rs0

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
      - --replSet=rs0
      - --bind_ip_all
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'try { if (!rs.status().ok) quit(1) } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(1) }',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - data:/data/db
    logging:
      driver: none

volumes:
  data:
  node_modules:
