[package]
name = "otserver-scanner"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0"
homepage = "https://otserver.org"
description = "Read-only OT discovery for OTserver"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
async-snmp = { version = "0.16", default-features = false, features = ["crypto-rustcrypto", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }
native-tls = "0.2"
oui-data = "0.2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls"] }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-native-tls = "0.3"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.29", optional = true }
async-opcua = { version = "0.19", features = ["client"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
async-opcua = { version = "0.19", features = ["server"] }
