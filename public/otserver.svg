<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="otGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Power / Shield OT Node Icon -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#otGrad)" stroke-width="5" stroke-dasharray="200 40" filter="url(#glow)" />
    <circle cx="50" cy="50" r="32" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
    <!-- Central Node Ring -->
    <path d="M 50 25 A 25 25 0 1 1 49.9 25" fill="none" stroke="url(#otGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Vertical Power Line -->
    <line x1="50" y1="15" x2="50" y2="45" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
    <!-- Connection Dots -->
    <circle cx="50" cy="50" r="4" fill="#00e676" />
    <circle cx="75" cy="50" r="3" fill="#00f2fe" />
    <circle cx="25" cy="50" r="3" fill="#00f2fe" />
  </g>

  <!-- Text: OTserver -->
  <text x="120" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#000000" letter-spacing="-1">
    OT<tspan fill="url(#otGrad)">server</tspan>
  </text>

  <!-- Subtitle Tag -->
  <text x="122" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="2">
    INDUSTRIAL OT INVENTORY &amp; DISCOVERY
  </text>
</svg>
